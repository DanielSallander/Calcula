[package]
name = "persistence"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
engine = { path = "../engine" }
identity = { path = "../identity" }
rust_xlsxwriter = "0.79"
calamine = "0.26"
quick-xml = "0.31"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The visual container slicers, timelines and floating grids persist (WP-C).
visual-format = { path = "../visual-format" }

[dev-dependencies]
tempfile = "3.10"