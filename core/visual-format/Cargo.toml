[package]
name = "visual-format"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The visual container (padding, title, subtitle, divider, background, border, shadow) every floating object carries -- the Rust mirror of @api/visualContainer"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
# A normal dependency, not a dev one: `with_field` takes a serde_json::Value
# (the literal a binding / script / MCP write arrives as).
serde_json = "1.0"
