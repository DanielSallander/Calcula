[package]
name = "pivot-engine"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
engine = { path = "../engine" }
identity = { path = "../identity" }
rustc-hash = "2.1"
smallvec = { version = "1.13", features = ["serde"] }
# The visual container a canvas pivot box carries (CanvasFrame.container, WP-C).
visual-format = { path = "../visual-format" }
# A normal dependency since WP-C: the lenient LOAD path of a pivot style reads
# the saved value as JSON first, so one bad style never drops the whole pivot.
serde_json = "1.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# The definition is persisted as opaque JSON by the .cala/.calp writers, so
# its serde contract is tested here rather than only downstream.
serde_json = "1.0"

[[bench]]
name = "pivot_calculations"
harness = false
