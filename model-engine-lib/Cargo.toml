[workspace]
members = ["crates/engine-core", "crates/engine-connectors", "crates/engine-query", "crates/engine"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
# Harmonized with the Calcula repo this workspace now lives in; the license
# texts are at the repo root (LICENSE-MIT / LICENSE-APACHE).
license = "MIT OR Apache-2.0"

[workspace.dependencies]
arrow = { version = "53", features = ["prettyprint", "ipc_compression"] }
datafusion = "44"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rhai = { version = "1", features = ["sync", "no_time", "no_module"] }
futures = "0.3"
parking_lot = "0.12"
tiberius = { version = "0.12", default-features = false, features = ["tds73", "chrono", "rust_decimal"] }
bb8 = "0.9"
bb8-tiberius = "0.16"
tokio-util = { version = "0.7", features = ["compat"] }
