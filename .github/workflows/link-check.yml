# The Windows gate: prove on every PR that the app crate COMPILES, LINKS and its
# unit tests PASS.
#
# WHY THIS EXISTS AS ITS OWN WORKFLOW.
#
# `ci.yml`'s rust-core job runs with `working-directory: core`, and that
# workspace's 11 members do not include `app/src-tauri` — so `cargo test
# --workspace` there structurally cannot reach the app crate. `cargo check`
# never invokes the linker at all. Before this workflow, the first thing in the
# whole tree that tried to link `app_lib.dll` was either a release build
# (`release.yml`, tag or manual dispatch only) or the nightly E2E launcher
# (`e2e-nightly.yml`, on a SELF-HOSTED runner). Neither gates a PR.
#
# So a green CI was compatible with an app that cannot start — and that is not
# hypothetical: four tracks changed Rust in one week, CI stayed green, and the
# first thing to exercise the link was a developer's E2E launcher, which failed
# with ~40 `LNK2001 unresolved external symbol` errors out of libcalp. The app
# crate's ~1,700 unit tests were ungated on a PR for the same reason.
# See `docs/design/open-items.md` section 2.6.
#
# WINDOWS IS NOT A PREFERENCE HERE. `app/src-tauri` imports
# `windows::Win32::Security::Credentials` with NO cfg gate
# (`src/ai_chat.rs:22`, `src/file_keychain.rs:16`, `src/bi/credential_cache.rs`),
# so the crate cannot compile on Linux at all. This can never be folded into
# `ci.yml`'s ubuntu jobs; it needs its own windows runner.
#
# CARGO_TARGET_DIR IS DELIBERATELY UNSET. The standing rule to point it outside
# the repo exists because the dev box keeps the repo in Dropbox, which locks
# `target/` mid-build (os error 32). A CI checkout has no such problem, and
# setting it would silently defeat the actions/cache key below.

name: App crate (Windows)

on:
  push:
    branches: [main]
  pull_request:

# NO `paths:` FILTER, on purpose. GitHub reports a path-skipped job as PENDING
# rather than success, so the moment this becomes a required status check every
# docs-only PR would block forever waiting for a job that will never run. If cost
# ever forces filtering, the correct shape is an always-running companion job
# that reports success — not a workflow-level paths filter.

jobs:
  link-and-test:
    name: links, and its unit tests pass
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Keyed on the app crate's tree: this job builds only that.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri -> target
          key: app-crate-windows

      # ---- THE LINK ------------------------------------------------------
      # The frontend is NOT built. `tauri build` would demand `dist/`, but
      # `cargo build` inside src-tauri does not — and the question this step asks
      # is about the Rust link, not the bundle. `cargo build` is the minimum that
      # invokes `link.exe`.
      - name: Build the library and binaries (this invokes link.exe)
        working-directory: app/src-tauri
        run: cargo build --lib --bins

      # PROVE IT, rather than trusting the exit code: a fully-cached `cargo build`
      # can report success having produced nothing, and a missing `app_lib.dll` is
      # exactly the failure this gate exists to catch.
      #
      # `shell: pwsh` is required — the default on windows runners is PowerShell
      # 5.1, where `$LASTEXITCODE` propagation and `throw` behaviour differ.
      - name: Verify the linked artefacts exist
        shell: pwsh
        working-directory: app/src-tauri
        run: |
          $lib = Get-ChildItem -Path target/debug -Filter app_lib.dll -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $lib) {
            Write-Error "app_lib.dll was not produced. cargo build reported success, so this is a CACHE or PROFILE problem, not a compile error."
            exit 1
          }
          Write-Host "[OK] $($lib.FullName) - $([math]::Round($lib.Length/1MB,1)) MB"

      # ---- THE TESTS -----------------------------------------------------
      #
      # THREE STEPS, AND THE ORDER IS LOAD-BEARING. A plain `cargo test --lib`
      # cannot work here: cargo TEST executables do not get tauri-build's embedded
      # Windows manifest, a manifest-less exe binds comctl32 v5, and the app's link
      # graph imports v6-only exports (TaskDialogIndirect, via the tauri
      # dialog/menu stack) — so the binary fails to LOAD with
      # STATUS_ENTRYPOINT_NOT_FOUND (0xc0000139) before running a single test.
      #
      # `fix-test-manifest.ps1` embeds the common-controls v6 dependency with
      # mt.exe into the ALREADY-LINKED exe, which means ANY subsequent link throws
      # it away. So: build with --no-run, patch, then run the exe directly. Cargo
      # cannot relink what it is not invoked for.
      - name: Build the test executable (no run)
        working-directory: app/src-tauri
        run: cargo test --lib --no-run

      - name: Embed the comctl32 v6 manifest
        shell: pwsh
        working-directory: app/src-tauri
        run: ./fix-test-manifest.ps1

      - name: Run the app crate unit tests
        shell: pwsh
        working-directory: app/src-tauri
        run: |
          $exe = Get-ChildItem -Path target/debug/deps -Filter "app_lib-*.exe" |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) {
            Write-Error "no app_lib-*.exe under target/debug/deps - `cargo test --no-run` produced nothing to run."
            exit 1
          }
          Write-Host "[run] $($exe.Name)"
          & $exe.FullName --test-threads 4
          if ($LASTEXITCODE -ne 0) {
            Write-Error "app crate unit tests failed (exit $LASTEXITCODE)."
            exit $LASTEXITCODE
          }
