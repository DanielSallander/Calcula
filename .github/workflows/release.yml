# Release: build Windows installers (.msi + .exe/NSIS) and publish them to a
# GitHub Release.
#
# Why CI rather than a local build: the primary dev box is a Snapdragon X Elite
# (aarch64 host), so a local `tauri build` produces ARM64-only installers that
# will NOT run on the x64 machines almost every user has. The GitHub
# windows-latest runner is x64, so it produces the artifact that actually
# matters -- in a clean environment, which also catches "works on my machine"
# packaging bugs.
#
# Triggers:
#   - push a tag matching v*        -> builds and publishes a release
#   - manual run (workflow_dispatch) -> builds and uploads artifacts only,
#     so the pipeline can be exercised without cutting a release
#
# NOT YET CONFIGURED (deliberate, see docs/design/release-pipeline.md):
#   - Code signing: unsigned installers trigger a Windows SmartScreen
#     "unknown publisher" warning. Wire this up once a certificate exists.
#   - Auto-updater: needs the tauri-plugin-updater dependency plus a signing
#     keypair; enabling it half-way would break builds, so it is a follow-up.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # required to create the release and upload assets

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # x64 is the architecture that matters for distribution.
          - target: x86_64-pc-windows-msvc
            arch: x64
          # ARM64 is nearly free here and IS genuinely testable on the dev box.
          - target: aarch64-pc-windows-msvc
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust (with target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Cache the Rust build. The heavy cost here is the model engine's
      # Arrow/DataFusion dependency tree, so this matters a lot.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri
            core
            model-engine-lib
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # Builds the frontend (via beforeBuildCommand) + the Rust backend in
      # release, then bundles the .msi and NSIS .exe installers.
      - name: Build installers
        working-directory: app
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist-installers
          find "app/src-tauri/target/${{ matrix.target }}/release/bundle" \
            -type f \( -name '*.msi' -o -name '*-setup.exe' \) \
            -exec cp {} dist-installers/ \;
          ls -lh dist-installers/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: calcula-windows-${{ matrix.arch }}
          path: dist-installers/*
          if-no-files-found: error

      # Only on a version tag: attach the installers to a GitHub Release.
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installers/*
          draft: true # review before it goes public
          generate_release_notes: true
          body: |
            Windows installers for ${{ github.ref_name }}.

            **These installers are not code-signed yet.** Windows will show an
            "unknown publisher" SmartScreen warning; choose "More info" ->
            "Run anyway" to proceed.

            Pick the build that matches your machine:
            - **x64** - Intel/AMD processors (almost everyone)
            - **arm64** - Snapdragon / ARM-based Windows devices
