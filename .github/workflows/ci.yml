# Core CI: type-check, unit tests, and Rust tests + bench compile.
#
# Complements architecture-boundaries.yml (the focused boundary gate, kept
# separate so unrelated debt can't mask a boundary regression). All jobs run on
# Linux on purpose: it sidesteps the dev-box-only hazards (Git's link.exe
# shadowing MSVC, the ARM64-only core/setup-rust-env.ps1, and the in-Dropbox
# target/ lock) — none apply to a clean Linux checkout.
#
# The app/src-tauri crate is NOT built here, and never can be: it imports
# `windows::Win32::Security::Credentials` with no cfg gate (src/ai_chat.rs:22,
# src/file_keychain.rs:16, src/bi/credential_cache.rs), so it does not compile on
# Linux at all. That is a real gap and not a preference — `cargo check` never
# links, and this job's `--workspace` is rooted at `core`, whose 11 members do
# not include app/src-tauri, so nothing here can prove the app links.
#
# `link-check.yml` closes exactly that on a windows runner, on the same PR
# triggers. Its own header explains why a green CI used to be compatible with an
# app that could not start. The app crate's ~1.7k unit tests are still ungated on
# a PR; that is the remaining follow-up.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check-types
      # A checked-in fixture that no longer matches its generator is worse than
      # no fixture: every test built on it still passes, while asserting things
      # about data nobody can reproduce. The generator is deterministic (an
      # explicit LCG, no Math.random), so this is a byte comparison.
      - run: npm run check:model-fixture

  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test

  rust-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # The full core workspace test suite (engine / calp / parser / identity /
      # pivot-engine / script-engine). pivot-bench is excluded from the workspace
      # (out-of-repo path dep), so --workspace skips it.
      - run: cargo test --workspace
      # Compile-only gate for EVERY criterion bench in the workspace (no run, no
      # linker env needed). `--workspace` is load-bearing: this step used to be
      # `-p engine --benches`, which gated grid_engine.rs only — so
      # pivot-engine/benches/pivot_calculations.rs rotted into 24 compile errors
      # (integer literals where PivotId became an EntityId newtype) completely
      # unseen, because benches are outside `cargo check` and `cargo test`.
      - run: cargo check --workspace --benches
